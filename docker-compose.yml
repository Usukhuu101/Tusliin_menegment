services:
  chatbot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Use REVIEW content for demos until the medical reviewer marks documents ACTIVE.
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
    volumes:
      - chatbot-storage:/app/storage   # SQLite DB + search index survive restarts
    restart: unless-stopped

volumes:
  chatbot-storage:
