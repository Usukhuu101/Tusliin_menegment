# =============================================================================
# PRE-APPROVED EMERGENCY MESSAGES  (no LLM ever writes these)
# Must be reviewed by the medical advisor. Keep them short and actionable.
# 103 = Монгол Улсын түргэн тусламжийн дугаар.
# TODO (before launch): add verified national mental-health / crisis hotline
#       numbers to the `crisis` template after confirming them with the MOH.
# =============================================================================
version: "1.0"
reviewed_by: null
common:
  call_line: "📞 **Яг одоо 103 дугаарт залгаж түргэн тусламж дуудна уу.**"
  footer: "ℹ️ Би эмч биш тул онош тавих боломжгүй. Гэхдээ эдгээр шинж яаралтай үзлэг шаарддаг тул тусламж авахыг бүү хойшлуулаарай. Хажууд тань хүн байвал түүнд даруй хэлээрэй."

templates:
  general:
    headline: "Таны бичсэн шинж яаралтай тусламж шаардлагатай байж болзошгүй."
    steps:
      - "Тайван байж, хөдлөхөө зогсоон сууж эсвэл хэвтэж амраарай."
      - "Ганцаараа машин жолоодож эмнэлэг рүү бүү яваарай."
      - "Түргэн тусламжийн ажилтанд шинж хэзээ эхэлснийг хэлээрэй."

  cardiac:
    headline: "Цээжний өвдөлт нь зүрхний шигдээсийн шинж байж болзошгүй."
    steps:
      - "Хөдлөхөө даруй зогсоож, тав тухтай сууж амраарай."
      - "Хаалгаа нээж, ойр байгаа хүнд хэлээрэй."
      - "Ганцаараа машин жолоодож эмнэлэг рүү бүү яваарай."
      - "Хувцсаа сул болгож, тайван амьсгалаарай."

  stroke:
    headline: "Тархины харвалтын шинж байж болзошгүй — минут тутам чухал."
    steps:
      - "Шинж эхэлсэн цагийг тэмдэглээрэй (эмчилгээнд маш чухал)."
      - "Өвчтөнийг ганцааранг нь бүү орхиорой."
      - "Юм идүүлж, уулгахгүй байгаарай (залгих чадвар алдагдсан байж болно)."
      - "Ухаангүй боловч амьсгалж байвал хажуу тийш нь хэвтүүлээрэй."

  breathing:
    headline: "Амьсгалын хүнд хямрал байж болзошгүй."
    steps:
      - "Босоо сууж, хувцсаа сул болгоорой."
      - "Утаа, тоостой орчноос цэвэр агаарт гараарай."
      - "Тайван, удаан амьсгалахыг хичээгээрэй."

  anaphylaxis:
    headline: "Хүнд харшлын урвал (анафилакси) байж болзошгүй."
    steps:
      - "Эмчийн бичиж өгсөн адреналины автомат тариур байгаа бол зааврын дагуу даруй хэрэглээрэй."
      - "Харшил үүсгэсэн зүйлээс (эм, хоол, зөгий) аюулгүйгээр холдоорой."
      - "Хэвтэж, хөлөө өргөөрэй; амьсгалахад хэцүү бол сууж болно."
      - "Ганцаараа бүү байгаарай."

  unconscious:
    headline: "Ухаан алдах, таталт өгөх нь яаралтай тусламж шаарддаг."
    steps:
      - "Амьсгалж байгаа бол хажуу тийш нь хэвтүүлээрэй."
      - "Таталт өгч байвал аманд нь юм бүү хийгээрэй; эргэн тойрны хатуу, хурц зүйлсийг зайлуулаарай."
      - "Өвчтөнийг ганцааранг нь бүү орхиорой."

  co_poisoning:
    headline: "Угаарын хийн хордлого байж болзошгүй."
    steps:
      - "Тэр өрөө, байрнаас ДАРУЙ гарч цэвэр агаарт гараарай."
      - "Бусад хүмүүс, хүүхдүүдийг гаргаарай."
      - "Аюулгүй бол хаалга, цонхоо нээгээрэй."
      - "Буцаж орох, унтах гэж бүү оролдоорой."

  poisoning:
    headline: "Хордлого / эм хэтрүүлэх нь яаралтай тусламж шаарддаг."
    steps:
      - "Өөрөө бөөлжүүлэх гэж бүү оролдоорой."
      - "Уусан эм, бодисын сав, шошгыг авч яваарай."
      - "Хэзээ, хэр хэмжээгээр уусныг түргэн тусламжид хэлээрэй."

  bleeding:
    headline: "Их хэмжээний цус алдалт / цус бөөлжих нь яаралтай байдал."
    steps:
      - "Шарх байвал цэвэр даавуугаар хүчтэй, тасралтгүй дарж байгаарай."
      - "Өвчтөнийг хэвтүүлж, дулаан байлгаарай."
      - "Юм идүүлж, уулгахгүй байгаарай."

  infection:
    headline: "Хүнд халдвар (жишээ нь тархины бүрхүүлийн үрэвсэл, тахал) байж болзошгүй."
    steps:
      - "Хүлээлгүйгээр тусламж аваарай."
      - "Бусадтай ойр харьцахаас түр зайлсхийгээрэй."
      - "Шинж хэзээ эхэлсэн, тарвага зэрэг амьтантай харьцсан эсэхээ эмчид хэлээрэй."

  neuro:
    headline: "Гэнэтийн хүчтэй толгой өвдөлт / толгойн гэмтлийн аюултай шинж."
    steps:
      - "Хэвтэж амраарай, ганцаараа бүү байгаарай."
      - "Юм идэж, уухаас түр татгалзаарай."
      - "Шинж хэзээ, юуны дараа эхэлснийг тэмдэглээрэй."

  hypothermia:
    headline: "Хүнд хэт даарал (хөлдөлт) байж болзошгүй."
    steps:
      - "Дулаан газар оруулж, нойтон хувцсыг солиорой."
      - "Хөнжлөөр ороож аажмаар дулаацуулаарай; халуун усанд бүү оруулаарай."
      - "Архи бүү уулгаарай."

  crisis:
    style: crisis
    headline: "Таны бичсэн зүйлийг уншаад би санаа зовж байна. Та энэ хүнд байдалд ганцаараа байх ёсгүй."
    call_line: "📞 **Хэрэв та яг одоо өөртөө хор хүргэх аюулд байгаа бол 103 дугаарт залгаарай** эсвэл ойрын эмнэлгийн яаралтай тусламжийн тасагт очоорой."
    steps:
      - "Итгэдэг хүндээ (гэр бүл, найз) яг одоо залгаж, хажууд тань байхыг хүсээрэй."
      - "Өөрийгөө гэмтээж болох зүйлсээс (эм, хурц зүйл) холдоорой."
      - "Сэтгэцийн эрүүл мэндийн мэргэжилтэнд (Сэтгэцийн эрүүл мэндийн үндэсний төв эсвэл ойрын эмнэлэг) хандаарай."
    footer: "💛 Таны мэдэрч буй зүйл чухал. Тусламж авснаар олон хүн ийм хүнд үеийг давж гардаг. Хэрэв ярихыг хүсвэл би энд байна."
