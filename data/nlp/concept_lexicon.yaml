# =============================================================================
# Mongolian health CONCEPT LEXICON  (data, not code — reviewed & versioned)
# -----------------------------------------------------------------------------
# One concept id <- many ways of writing it.
#   mn:    Cyrillic patterns. Each word is a STEM (prefix): "өвд" matches
#          өвдөх / өвдөөд / өвдсөн / өвдөлт. Words must appear in order,
#          within 4 words of each other.  "эм$" = exact word only.
#   latin: Latin chat-script patterns (transliterated automatically).
#   en:    English words/phrases (whole-word match).
# type: symptom | red_flag | modifier | context | condition | exposure | medication
# How to add a synonym: add a line, run `python -m pytest tests/test_normalizer.py`,
# then `python evaluation/run_eval.py` and check nothing regressed.
# Seeded partly from symptom wording in the MMRA adverse-reaction reports.
# =============================================================================
version: "1.0"
concepts:

